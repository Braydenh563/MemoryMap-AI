[pytest]
testpaths = tests
addopts = -q
# So a plain `pytest` works in a fresh clone, without an editable install and
# without remembering to set PYTHONPATH. The README and CONTRIBUTING both say
# `pytest`; before this they were only true after `pip install -e .`, and the
# failure (`No module named 'memorymap'`) looks like a broken checkout rather
# than a missing step.
pythonpath = src
# `evals`: tests that need a real local model, which the suite never has.
# Registered here so `pytest -m evals` is a documented selection rather than a
# marker typo, and deliberately NOT excluded in addopts: the modules that carry
# it skip themselves at collection when MEMORYMAP_EVALS_URL and
# MEMORYMAP_EVALS_MODEL are unset, so an ordinary run collects none of them and
# `-m "not evals"` in addopts would only make `pytest -m evals` harder to type.
# `scratchpad/llama-dev.sh serve` prints those two variables; nothing in tests/
# imports or runs that script.
markers =
    evals: needs a real local model (scratchpad/llama-dev.sh)
