<style>

;grid-template-columns:repeat(auto-fill,minmax(106px,1fr));gap:10px}.spec{display:grid;place-items:center;align-content:center;gap:5px;min-width:0;min-height:105px;padding:10px 6px;background:#11131f;border:1px solid transparent;border-radius:8px}.spec:hover{border-color:var(--accent)}.stage{height:94px;width:100%;display:flex;align-items:center;justify-content:center;isolation:isolate}.stage.figure{height:145px;padding:16px 24px}.stage svg{display:block;max-width:100%;overflow:visible}.label{max-width:100%;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hero{display:grid;grid-template-columns:minmax(190px,280px) 1fr;gap:14px}.hero .stage{height:240px;background:#11131f;border-radius:8px}.info{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;align-content:start}.info dt{color:var(--muted)}.info dd{margin:0;overflow-wrap:anywhere}.experiment svg{transform:scale(var(--lab-scale,1));transform-box:fill-box;transform-origin:center}.experiment .stage{overflow:visible}.toast{position:fixed;left:50%;bottom:18px;opacity:0;transform:translate(-50%,60px);padding:7px 12px;border:1px solid var(--line);border-radius:20px;background:var(--p2);transition:.18s}.toast.on{opacity:1;transform:translate(-50%,0)}@media(max-width:760px){.lab{display:block}.top{position:static;flex-wrap:wrap}.side{border-right:0;border-bottom:1px solid var(--line)}.canvas{padding:12px}.hero{grid-template-columns:1fr}}

<div class="lab"><header class="top"><h1>Avatar Lab</h1><span class="tag">isolated preview bench</span><span class="tag" id="status"></span><i class="push"></i><button id="motion">Motion</button><button id="clear">Clear</button></header><aside class="side">
<section class="sec"><h2>Atlas</h2><label class="field">Look<select id="look"><option>masculine</option><option>feminine</option></select></label><label class="field">Style<select id="style"><option>character</option><option>classic</option></select></label><div id="moods" class="moods"></div><div class="row"><button class="main" data-do="atlas">Preview</button><button data-do="moods">All moods</button><button data-do="sizes">All sizes</button><button data-do="compare">Compare</button></div></section>
<section class="sec"><h2>Generated avatar</h2><label class="field">Name / seed<input id="seed" value="Brayden"></label><div class="row"><button class="main" data-do="avatar">Preview</button><button data-do="figure">Figure</button><button data-do="avatar-sizes">All sizes</button></div></section>
<section class="sec"><h2>Fixtures</h2><div class="row"><button data-fixture="names">Names</button><button data-fixture="animals">Animals</button><button data-fixture="costumes">Costumes</button><button data-fixture="edge">Edge cases</button></div></section>
<section class="sec"><h2>Temporary experiment</h2><label class="field">Accent<input type="color" id="accent" value="#6d5dfc"></label><label class="field">Scale<input type="range" id="scale" min="70" max="150" value="100"></label><label class="field">CSS override<textarea id="css" spellcheck="false" placeholder=".atl-aura { opacity: .4; }"></textarea></label><div class="row"><button class="main" id="apply">Apply locally</button><button id="save">Save preset</button><button id="reset">Reset</button></div><p class="tag">Changes live only in this browser. They never edit the app files.</p></section>
<section class="sec"><h2>Notes</h2><textarea id="notes" placeholder="What changed, what to fix, what you like..."></textarea><div class="row"><button id="copy">Copy</button><button id="download">Download session</button></div></section></aside>
<main class="canvas" id="canvas"><div class="empty"><h2>Start with a specimen.</h2><p>This calls the app’s real renderers while keeping experiments and preferences separate.</p></div></main></div><div class="toast" id="toast"></div>
