<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Soft background glow matching the app's radial-gradient blobs -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4f6df5" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#4f6df5" stop-opacity="0" />
    </radialGradient>
    
    <!-- Vibrant gradient for the memory links -->
    <linearGradient id="linkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f6df5" />
      <stop offset="100%" stop-color="#c026d3" />
    </linearGradient>
  </defs>

  <!-- Ambient background wash -->
  <circle cx="50" cy="50" r="46" fill="url(#coreGlow)" />

  <!-- Abstract topographic/orbital rings -->
  <circle cx="50" cy="50" r="32" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" stroke-dasharray="4 4" />
  <circle cx="50" cy="50" r="18" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1" />

  <!-- Constellation Links (The "Map") -->
  <path d="M 50 28 L 72 54 L 46 72 L 24 50 L 32 30 Z" 
        fill="none" stroke="url(#linkGrad)" stroke-width="3" stroke-linejoin="round" />
        
  <!-- Internal Neural Connections -->
  <line x1="50" y1="50" x2="72" y2="54" stroke="url(#linkGrad)" stroke-width="2" opacity="0.8" />
  <line x1="50" y1="50" x2="24" y2="50" stroke="url(#linkGrad)" stroke-width="2" opacity="0.8" />
  <line x1="50" y1="50" x2="32" y2="30" stroke="url(#linkGrad)" stroke-width="2" opacity="0.8" />

  <!-- The Nodes -->
  <circle cx="50" cy="50" r="5" fill="#ffffff" /> <!-- Central Core -->
  <circle cx="50" cy="28" r="3.5" fill="#4f6df5" stroke="#ffffff" stroke-width="1.5" />
  <circle cx="72" cy="54" r="4.5" fill="#c026d3" />
  <circle cx="46" cy="72" r="3" fill="#ffffff" />
  <circle cx="24" cy="50" r="4" fill="#4f6df5" />
  <circle cx="32" cy="30" r="3" fill="#ffffff" />
</svg>
