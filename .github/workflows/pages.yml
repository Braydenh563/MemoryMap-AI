name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/index.html'
      - 'docs/**/*.md'
      - 'CHANGELOG.md'
      - 'CONTRIBUTING.md'
      - 'IDEAS.md'
      - 'SECURITY.md'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bake doc files into index.html as inline JSON
        run: |
          python3 - <<'PYEOF'
          import json, pathlib, re

          docs = {
            "architecture": "docs/ARCHITECTURE.md",
            "roadmap":      "docs/ROADMAP.md",
            "changelog":    "CHANGELOG.md",
            "contributing": "CONTRIBUTING.md",
            "ideas":        "IDEAS.md",
            "security":     "SECURITY.md",
          }

          baked = {}
          for key, path in docs.items():
              p = pathlib.Path(path)
              baked[key] = p.read_text(encoding="utf-8") if p.exists() else f"# {key.title()}\n\n_Not found._"

          html = pathlib.Path("docs/index.html").read_text(encoding="utf-8")

          # Inject the baked docs as a JS variable right before the closing </script>
          blob = json.dumps(baked, ensure_ascii=False)
          inject = f"const BAKED_DOCS = {blob};\n\n"

          # Replace the loadDoc fetch block with a baked version
          # Find the marker comment and replace the async fetch with a sync lookup
          old_fetch = r"""async function loadDoc\(key\)\{[\s\S]*?^loadDoc\('architecture'\);"""
          new_fetch = """async function loadDoc(key){
            frame.innerHTML='<div class=\"spinner\"></div>';
            if(cache[key]){ frame.innerHTML=cache[key]; return; }
            const md = BAKED_DOCS[key];
            if(md !== undefined){
              cache[key] = mdToHtml(md);
              frame.innerHTML = cache[key];
            } else {
              const ghUrl = 'https://github.com/'+REPO+'/blob/main/'+DOC_MAP[key];
              frame.innerHTML=`<div class=\"docs-err\">Couldn't load — <a href="${ghUrl}" target="_blank" rel="noopener">read it on GitHub</a>.</div>`;
            }
          }

          document.querySelectorAll('.dpill').forEach(pill=>{
            pill.addEventListener('click',()=>{
              document.querySelectorAll('.dpill').forEach(p=>p.classList.remove('on'));
              pill.classList.add('on');
              loadDoc(pill.dataset.doc);
            });
          });
          loadDoc('architecture');"""

          html_new = re.sub(old_fetch, new_fetch, html, flags=re.MULTILINE)

          # Prepend the baked data blob
          html_new = html_new.replace("<script>\n// Theme toggle", f"<script>\n{inject}// Theme toggle")

          pathlib.Path("_site/index.html").parent.mkdir(parents=True, exist_ok=True)
          pathlib.Path("_site/index.html").write_text(html_new, encoding="utf-8")
          print("Done — baked", list(baked.keys()))
          PYEOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
