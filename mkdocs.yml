site_name: MemoryMap AI
site_description: "100% offline, local-first AI notebook — documentation"
site_url: https://braydenh563.github.io/MemoryMap-AI/
repo_url: https://github.com/Braydenh563/MemoryMap-AI
repo_name: Braydenh563/MemoryMap-AI
edit_uri: edit/main/

theme:
  name: material
  palette:
    - scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.action.edit
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - git-revision-date-localized:
      enable_creation_date: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: README.md
  - Getting Started:
      - README.md
      - CONTRIBUTING.md
  - Architecture: docs/ARCHITECTURE.md
  - Roadmap: docs/ROADMAP.md
  - Changelog: CHANGELOG.md
  - Security: SECURITY.md
