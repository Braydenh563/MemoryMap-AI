# Draft only. Publish on the host's loopback so the notebook is not on the
# network by accident; put a reverse proxy with TLS in front for other devices.
services:
  memorymap:
    build:
      context: ../..
      dockerfile: scratchpad/docker/Dockerfile
      args:
        WITH_EMBEDDER: "0"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - memorymap-data:/data      # notebook: database, files, certificate
      - memorymap-models:/models  # embedding model, whisper, OCR, Pyodide
    environment:
      OLLAMA_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"   # Linux needs this line
    restart: unless-stopped
volumes:
  memorymap-data:
  memorymap-models:
