<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img"
     aria-label="MemoryMap AI">
  <title>MemoryMap AI</title>
  <!--
    The same mark the app draws in-page (renderEmblem in app.js): a bright hub
    with notes orbiting it, joined by links. Everything here is sized for 16px
    first and then checked at 32 and 180 — a favicon is read at 16 far more
    often than at any other size, and the previous version was designed at
    100: dashed rings, 1px strokes and 3px dots that turned to grey mush in a
    tab. Nothing below is thinner than about 1px once scaled down.

    It also sits on a filled tile rather than on transparency. The old mark
    used white nodes with no background, so on a light tab strip the brightest
    parts of the logo simply weren't there.
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <!-- The app's own theme-color, running into the accent it pairs with. -->
      <stop offset="0%" stop-color="#5b7cff" />
      <stop offset="55%" stop-color="#4f6df5" />
      <stop offset="100%" stop-color="#a927d8" />
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect width="100" height="100" rx="23" fill="url(#tile)" />
  <rect width="100" height="100" rx="23" fill="url(#sheen)" />

  <!-- Spokes only, not every pentagon edge: ten crossing lines read as a
       smudge below about 24px, five radiating ones still read as a map. -->
  <g stroke="#ffffff" stroke-width="5.5" stroke-linecap="round" opacity="0.92">
    <path d="M50 50 50 20" />
    <path d="M50 50 78.5 40.7" />
    <path d="M50 50 67.6 74.3" />
    <path d="M50 50 32.4 74.3" />
    <path d="M50 50 21.5 40.7" />
  </g>

  <!-- The notes. Kept inside a radius of 40 from centre so this same artwork
       survives Android's maskable safe zone — see icon-maskable.svg. -->
  <g fill="#ffffff">
    <circle cx="50" cy="20" r="7.5" />
    <circle cx="78.5" cy="40.7" r="7.5" />
    <circle cx="67.6" cy="74.3" r="7.5" />
    <circle cx="32.4" cy="74.3" r="7.5" />
    <circle cx="21.5" cy="40.7" r="7.5" />
  </g>

  <!-- The hub, ringed in the tile colour so it stays distinct from a node it
       might otherwise touch at small sizes. -->
  <circle cx="50" cy="50" r="13" fill="#4f6df5" />
  <circle cx="50" cy="50" r="9.5" fill="#ffffff" />
</svg>
