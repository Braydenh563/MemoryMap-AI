<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img"
     aria-label="Tessellate">
  <title>Tessellate</title>
  <!--
    The maskable variant, for Android home screens. Android crops an installed
    icon to whatever shape the launcher uses (circle, squircle, teardrop), so
    a maskable icon must bleed to the edges (no rounded corners of its own, or
    the crop cuts a second, wonky corner out of the first) and must keep
    everything meaningful inside the central 80%: a circle of radius 40 about
    the centre.

    The mark in favicon.svg was drawn to that budget already: its farthest
    stroke edge is about 36 from the centre (the lifted cell's top corner and
    the bottom cells' outer corners), which is why this file is the same
    artwork on a square field rather than a separate, smaller drawing.
    tests/test_brand_mark.py holds both files to the same points.
  -->
  <defs>
    <linearGradient id="tileMask" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="100" y2="100">
      <stop offset="0%" stop-color="#5b7cff" />
      <stop offset="55%" stop-color="#4f6df5" />
      <stop offset="100%" stop-color="#a927d8" />
    </linearGradient>
    <linearGradient id="pearlMask" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#c9b8ff" />
    </linearGradient>
    <filter id="liftMask" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#1a1060" flood-opacity="0.45" />
    </filter>
  </defs>

  <rect width="100" height="100" fill="url(#tileMask)" />

  <g opacity="0.95">
    <polygon points="35.3,48.7 46.8,55.4 46.8,68.6 35.3,75.3 23.8,68.6 23.8,55.4" fill="#ffffff" stroke="#ffffff" stroke-width="7" stroke-linejoin="round" />
  </g>
  <g opacity="0.7">
    <polygon points="64.7,48.7 76.2,55.4 76.2,68.6 64.7,75.3 53.2,68.6 53.2,55.4" fill="#ffffff" stroke="#ffffff" stroke-width="7" stroke-linejoin="round" />
  </g>
  <g filter="url(#liftMask)">
    <polygon points="57.3,18.4 67.5,27.0 65.2,40.0 52.7,44.6 42.5,36.0 44.8,23.0" fill="url(#pearlMask)" stroke="url(#pearlMask)" stroke-width="7" stroke-linejoin="round" />
  </g>
</svg>
