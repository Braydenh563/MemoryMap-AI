# CI (Wave I): the whole test suite runs offline — every AI piece is
# faked in tests/ — so this needs nothing but Python and pip. No GPU,
# no Ollama, no models, no network beyond installing dependencies.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # lets you run it by hand from the Actions tab

# Cancel superseded runs on the same branch/PR so pushes don't pile up.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install ruff
        run: python -m pip install --upgrade pip ruff

      - name: Lint
        run: ruff check .

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run the test suite
        run: python -m pytest

  e2e:
    # roadmap ANALYSIS.md §31 / ROADMAP.md §38.2: the job above fakes every
    # AI call and never opens a browser, so a clipped tab, an overlapping
    # z-index or a console exception has never once failed a CI run — every
    # layout bug this project has found was found by hand, after shipping.
    # This is the fix: a real headless Chromium against a real running app.
    name: E2E smoke suite (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests-e2e/package-lock.json

      - name: Install Playwright + browser
        working-directory: tests-e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run the smoke suite
        working-directory: tests-e2e
        run: npx playwright test

      - name: Upload the report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests-e2e/playwright-report/
          retention-days: 7
