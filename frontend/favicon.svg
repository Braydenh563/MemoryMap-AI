<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img"
     aria-label="Tessellate">
  <title>Tessellate</title>
  <!--
    The mark (brief "logo", 2026-10-11): three hexagon cells of a
    tessellation, two settled along the bottom and the third lifted above
    them, turned 10 degrees and casting a shadow, about to settle into place.
    The app draws the same geometry in-page and animates the landing
    (renderEmblem in phone-shell.js, `EMBLEM_GEOMETRY`); the points below are
    computed from those constants, and tests/test_brand_mark.py fails when
    the two drift apart.

    Sized for 16px first and then checked at 32 and 180: a favicon is read
    at 16 far more often than at any other size. So three solid cells and no
    thin lines: each hexagon is a fill plus a same-colour stroke 7 wide with
    round joins, which softens its corners and keeps every cell at least 4px
    across in a tab. The opacity of each cell is on a wrapping <g>, never on
    the fill and the stroke separately, or the stroke over the fill would
    paint a brighter ring.

    It sits on a filled tile rather than on transparency, so the white cells
    still show on a light tab strip.
  -->
  <defs>
    <!-- userSpaceOnUse across the whole 100x100 tile: the app's own
         theme-color running into the accent it pairs with. -->
    <linearGradient id="tile" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="100" y2="100">
      <stop offset="0%" stop-color="#5b7cff" />
      <stop offset="55%" stop-color="#4f6df5" />
      <stop offset="100%" stop-color="#a927d8" />
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <!-- The lifted cell's pearl: white into a pale violet, corner to corner. -->
    <linearGradient id="pearl" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#c9b8ff" />
    </linearGradient>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#1a1060" flood-opacity="0.45" />
    </filter>
  </defs>

  <rect width="100" height="100" rx="23" fill="url(#tile)" />
  <rect width="100" height="100" rx="23" fill="url(#sheen)" />

  <!-- Kept inside a radius of 40 from centre (the farthest stroke edge is
       about 36), so this same artwork survives Android's maskable safe zone;
       see icon-maskable.svg. -->
  <g opacity="0.95">
    <polygon points="35.3,48.7 46.8,55.4 46.8,68.6 35.3,75.3 23.8,68.6 23.8,55.4" fill="#ffffff" stroke="#ffffff" stroke-width="7" stroke-linejoin="round" />
  </g>
  <g opacity="0.7">
    <polygon points="64.7,48.7 76.2,55.4 76.2,68.6 64.7,75.3 53.2,68.6 53.2,55.4" fill="#ffffff" stroke="#ffffff" stroke-width="7" stroke-linejoin="round" />
  </g>
  <g filter="url(#lift)">
    <polygon points="57.3,18.4 67.5,27.0 65.2,40.0 52.7,44.6 42.5,36.0 44.8,23.0" fill="url(#pearl)" stroke="url(#pearl)" stroke-width="7" stroke-linejoin="round" />
  </g>
</svg>
