# Release: builds the Python package and publishes to PyPI whenever a
# version tag (v*) is pushed. Also creates a matching GitHub Release.
#
# Prerequisites:
#   1. Add a PyPI API token as a repo secret named PYPI_API_TOKEN.
#   2. Push a tag: git tag v0.1.0 && git push origin v0.1.0

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # needed to create the GitHub Release

jobs:
  build-and-publish:
    name: Build & publish to PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history so setuptools-scm can read tags if ever added

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade pip build twine

      - name: Build sdist + wheel
        run: python -m build

      - name: Check distribution
        run: twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

  github-release:
    name: Create GitHub Release
    needs: build-and-publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Extract changelog entry for this tag
        id: changelog
        run: |
          TAG=${GITHUB_REF_NAME}
          # Pull the section between this version header and the next
          NOTES=$(awk "/^## \[?${TAG#v}\]?/,/^## /" CHANGELOG.md | head -n -1 | tail -n +2)
          echo "notes<<EOF" >> "$GITHUB_OUTPUT"
          echo "$NOTES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          body: ${{ steps.changelog.outputs.notes }}
          generate_release_notes: ${{ steps.changelog.outputs.notes == '' }}

  build-windows-installer:
    name: Build Windows installer
    # After github-release, not in parallel with it: this job uploads an
    # asset to the release that job creates, via the same action run again
    # with the same tag — softprops/action-gh-release adds to an existing
    # release under that tag rather than making a second one, but only if
    # the release already exists by the time this runs.
    needs: github-release
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build dependencies
        # The base app's own deps, minus sentence-transformers/torch:
        # Settings -> Packages already treats semantic search as an
        # optional install fetched after the app is running (core/extras.py
        # id="semantic"), same as voice dictation and the desktop window
        # itself — bundling a torch download into the base installer would
        # be inconsistent with that and a few hundred MB for a feature this
        # build already has a working path to install on demand.
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install fastapi "uvicorn[standard]" SQLAlchemy python-dotenv \
            requests numpy "fsspec[http]" bcrypt cryptography \
            python-multipart pywebview pyinstaller
          pip install -e . --no-deps

      - name: Build the frozen app (PyInstaller)
        shell: bash
        run: |
          pyinstaller packaging/windows/memorymap.spec --distpath dist --workpath build --noconfirm

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build the installer
        shell: pwsh
        env:
          MEMORYMAP_VERSION: ${{ github.ref_name }}
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          $env:MEMORYMAP_VERSION = $version
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\windows\installer.iss

      - name: Upload installer to the release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/installer/MemoryMap-AI-Setup-*.exe
