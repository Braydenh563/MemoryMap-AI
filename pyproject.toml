# Minimal packaging config so `pip install -e .` makes the src/ layout
# importable everywhere (the simplest thing that works for a beginner:
# no PYTHONPATH fiddling on any OS).
[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "memorymap"
version = "0.1.3"
description = "MemoryMap AI — a 100% offline, local-first AI notebook"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
keywords = ["notes", "notebook", "ai", "offline", "local-first", "ollama", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: News/Diary",
]

[project.urls]
Homepage = "https://github.com/Braydenh563/MemoryMap-AI-v0"
Repository = "https://github.com/Braydenh563/MemoryMap-AI-v0"
Issues = "https://github.com/Braydenh563/MemoryMap-AI-v0/issues"
Changelog = "https://github.com/Braydenh563/MemoryMap-AI-v0/blob/main/CHANGELOG.md"

[project.scripts]
memorymap = "memorymap.__main__:main"

# Optional extras — install only the ones whose feature you want, e.g.
#   pip install -e ".[voice]"     # local Whisper dictation for the 🎙 buttons
#   pip install -e ".[desktop]"   # `python -m memorymap --desktop` app window
[project.optional-dependencies]
voice = ["faster-whisper"]
desktop = ["pywebview", "pystray", "Pillow"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Ruff's default rules: pyflakes (F) + a curated pycodestyle subset (E). This
# is what CI enforces and the code is already clean under it. Line-length (E501)
# is intentionally left out — long strings/URLs in tests would flag noisily; run
# `ruff format` locally if you want wrapping.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# `__all__` lists names this module resolves lazily through a PEP 562
# module `__getattr__` (see the comment above it) rather than binding them
# with a real import — the whole point being to not import the four split
# modules back at load time, which is what made this file part of a cyclic
# import. Pyflakes has no way to see through `__getattr__`, so every one of
# those names reads as undefined here; F822 is the tradeoff for that.
"src/memorymap/search/searxng_manager.py" = ["F822"]
